services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datz
      POSTGRES_USER: datz
      POSTGRES_PASSWORD: datz
    ports:
      - "5432:5432"
    volumes:
      - datz_postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgres://datz:datz@postgres:5432/datz
      PORT: 4000
      CORS_ORIGIN: http://localhost:4173
      SCRAPER_ENABLED: "true"
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  datz_postgres:
